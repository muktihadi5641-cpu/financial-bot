<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Financial Dashboard</title>
<!-- PWA -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Financial">
<meta name="theme-color" content="#1D4ED8">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg:       #F1F5F9;
  --card:     #FFFFFF;
  --primary:  #1E3A8A;
  --primary2: #1D4ED8;
  --income:   #16A34A;
  --expense:  #DC2626;
  --invest:   #D97706;
  --savings:  #2563EB;
  --text:     #0F172A;
  --sub:      #64748B;
  --border:   #E2E8F0;
  --radius:   16px;
  --shadow:   0 2px 12px rgba(0,0,0,0.07);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--text);min-height:100vh;padding-bottom:32px}

/* ── Header ──────────────────────────────────────────────── */
.header{
  background:linear-gradient(160deg,#080f2e 0%,#0f2666 45%,#1a44c2 100%);
  position:relative;
  overflow:hidden;
  min-height:220px;
}
/* padding-bottom 28px = ruang untuk baris label tanggal 1-31 di bawah.
   pointer-events:none → hover lewat tembus ke canvas di bawah, supaya tooltip
   chart bisa muncul saat kursor di area teks yang menutupi canvas. */
.header-body{padding:22px 20px 28px;position:relative;z-index:2;pointer-events:none}
.header-body .sync-badge{pointer-events:auto}
.header::before{
  content:'';position:absolute;right:-80px;top:-80px;
  width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(99,138,255,0.18) 0%,transparent 70%);
  pointer-events:none;
}
.header::after{
  content:'';position:absolute;left:-40px;bottom:-60px;
  width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,rgba(59,130,246,0.12) 0%,transparent 70%);
  pointer-events:none;
}
.header-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
.header-logo{font-size:11px;font-weight:700;color:rgba(255,255,255,0.45);letter-spacing:1.2px;text-transform:uppercase}
.header-top-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.sync-badge{
  display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,0.1);
  padding:5px 11px;border-radius:20px;
  font-size:11px;font-weight:600;color:rgba(255,255,255,0.8);
  backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.12);
  letter-spacing:.3px;
}
.sync-dot{width:6px;height:6px;border-radius:50%;background:#4ADE80;box-shadow:0 0 6px #4ADE80}
.sync-dot.stale{background:#FCA5A5;box-shadow:0 0 6px #FCA5A5}
/* Rate badge (NT$ → Rp live exchange) */
.rate-badge{
  display:flex;align-items:center;gap:5px;
  background:rgba(253,224,71,0.10);
  padding:4px 10px;border-radius:14px;
  font-size:10.5px;font-weight:600;color:rgba(253,224,71,0.92);
  border:1px solid rgba(253,224,71,0.22);
  letter-spacing:.2px;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
}
.rate-badge .rate-arrow{opacity:.55;font-size:10px}
.rate-badge.stale{opacity:.6}
.header-month{font-size:12px;color:rgba(255,255,255,0.55);margin-bottom:4px;font-weight:500;letter-spacing:.4px;text-transform:uppercase}
.header-net{font-size:34px;font-weight:800;color:#fff;letter-spacing:-.9px;margin-bottom:2px;line-height:1.15;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.header-net-sub{font-size:14px;font-weight:500;color:rgba(255,255,255,0.58);margin-bottom:6px;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.header-net-label{font-size:10px;color:rgba(255,255,255,0.40);letter-spacing:.4px;text-transform:uppercase}

/* ── Header chart — confined ke kotak tengah ──────────────
   WRAPPER dibatasi HORIZONTAL: setelah ujung teks "+Savings)" di kiri,
   dan sebelum badge jam di kanan. Chart.js responsive akan baca dimensi
   wrapper (60% lebar header), bukan dari canvas/header langsung. */
/* Pakai class UNIK (.daily-chart-box) supaya tidak bentrok dengan .chart-wrap
   yang dipakai doughnut chart di section bawah (max-width:160px). */
.daily-chart-box{
  position:absolute;
  top:8px;
  left:20%;
  width:60%;
  height:calc(100% - 14px);
  z-index:0;
}
#daily-expense-chart{
  display:block;
  width:100%;
  height:100%;
}
/* Mobile */
@media(max-width:640px){
  .daily-chart-box{ left:50%; width:44%; }
}
@media(min-width:641px) and (max-width:900px){
  .daily-chart-box{ left:32%; width:54%; }
}
.header-veil{display:none}
/* Taipei skyline background — Taipei 101 + skyline + hills, opacity 40% */
.taipei-bg{
  position:absolute;
  left:0;right:0;bottom:0;
  height:100%;
  opacity:.40;
  z-index:0;
  pointer-events:none;
  overflow:hidden;
}
.taipei-bg svg{width:100%;height:100%;display:block}

/* ── Month tabs ──────────────────────────────────────────── */
.tabs-wrap{
  background:var(--card);
  box-shadow:0 2px 8px rgba(0,0,0,0.06);
  position:sticky;top:0;z-index:10;
}
.tabs{
  display:flex;overflow-x:auto;gap:0;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex-shrink:0;padding:13px 16px;
  font-size:13px;font-weight:500;color:var(--sub);
  border-bottom:2.5px solid transparent;
  cursor:pointer;white-space:nowrap;
  transition:color .2s,border-color .2s;
  -webkit-tap-highlight-color:transparent;
}
.tab:hover{color:var(--text)}
.tab.active{color:var(--primary2);border-bottom-color:var(--primary2);font-weight:600}

/* ── Main content ────────────────────────────────────────── */
.content{max-width:900px;margin:0 auto;padding:20px 16px 0}

/* ── Cards grid ──────────────────────────────────────────── */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.card{background:var(--card);border-radius:var(--radius);padding:18px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .18s ease,box-shadow .18s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(15,23,42,0.10)}
.card:active{transform:translateY(0)}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--radius) var(--radius) 0 0}
.card.income::before{background:var(--income)}
.card.expense::before{background:var(--expense)}
.card.invest::before{background:var(--invest)}
.card.savings::before{background:var(--savings)}
.card-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:10px}
.card.income .card-icon{background:linear-gradient(135deg,#F0FDF4 0%,#DCFCE7 100%)}
.card.expense .card-icon{background:linear-gradient(135deg,#FEF2F2 0%,#FEE2E2 100%)}
.card.invest .card-icon{background:linear-gradient(135deg,#FFFBEB 0%,#FEF3C7 100%)}
.card.savings .card-icon{background:linear-gradient(135deg,#EFF6FF 0%,#DBEAFE 100%)}
.card-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.card.income .card-label{color:var(--income)}
.card.expense .card-label{color:var(--expense)}
.card.invest .card-label{color:var(--invest)}
.card.savings .card-label{color:var(--savings)}
.card-ntd{font-size:17px;font-weight:700;color:var(--text);line-height:1.2;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.card-idr{font-size:13px;color:var(--sub);margin-top:4px;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.card-zero{color:#CBD5E1 !important;font-weight:500}

/* ── Charts section ──────────────────────────────────────── */
.charts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.chart-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.chart-title{font-size:13px;font-weight:600;color:var(--sub);margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px}
.chart-wrap{position:relative;max-width:160px;margin:0 auto}
.chart-center{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  text-align:center;pointer-events:none;
}
.chart-center-num{font-size:14px;font-weight:700;color:var(--text);line-height:1}
.chart-center-lbl{font-size:10px;color:var(--sub);margin-top:2px}
.chart-legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;margin-top:12px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--sub)}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.legend-val{font-weight:600;color:var(--text);margin-left:auto}

/* ── Transactions ────────────────────────────────────────── */
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.section-title{font-size:15px;font-weight:700;color:var(--text)}
.tx-count{font-size:12px;color:var(--sub)}
.filter-tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filter-tabs::-webkit-scrollbar{display:none}
.ftab{
  flex-shrink:0;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:500;
  border:1.5px solid var(--border);color:var(--sub);background:var(--card);
  cursor:pointer;white-space:nowrap;
  transition:transform .12s ease,border-color .15s ease,color .15s ease,background-color .15s ease;
  -webkit-tap-highlight-color:transparent;
}
.ftab:hover{border-color:var(--primary2);color:var(--primary2)}
.ftab:active{transform:scale(.96)}
.ftab.active{background:var(--primary2);border-color:var(--primary2);color:#fff;box-shadow:0 2px 6px rgba(29,78,216,0.25)}
.tx-list{display:flex;flex-direction:column;gap:8px}
.tx-item{
  background:var(--card);border-radius:12px;
  padding:12px 14px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:12px;
  position:relative;overflow:hidden;
  transition:transform .12s ease,box-shadow .15s ease;
}
.tx-item::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--border);transition:background-color .15s ease}
.tx-item.income::before{background:var(--income)}
.tx-item.expense::before{background:var(--expense)}
.tx-item.invest::before{background:var(--invest)}
.tx-item.savings::before{background:var(--savings)}
.tx-item:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(15,23,42,0.08)}
.tx-item:active{transform:scale(.985)}
.tx-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-left:4px}
.tx-dot.income{background:var(--income)}
.tx-dot.expense{background:var(--expense)}
.tx-dot.invest{background:var(--invest)}
.tx-dot.savings{background:var(--savings)}
.tx-info{flex:1;min-width:0}
.tx-desc{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{font-size:11px;color:var(--sub);margin-top:2px}
.tx-amt{text-align:right;flex-shrink:0}
.tx-idr{font-size:13px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.tx-ntd{font-size:11px;color:var(--sub);margin-top:1px;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.tx-amt-primary{font-size:14px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.empty-state{text-align:center;padding:40px 20px;color:var(--sub);font-size:14px}
.empty-icon{font-size:40px;margin-bottom:8px;display:block}

/* ── Loading / Error ─────────────────────────────────────── */
.loading{text-align:center;padding:60px 20px}
.spinner{display:inline-block;width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--primary2);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-banner{background:#FEF2F2;border:1px solid #FECACA;border-radius:12px;padding:16px;color:#991B1B;font-size:13px;margin-bottom:16px}

/* ── Net balance bar ─────────────────────────────────────── */
.net-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.net-card{background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.net-card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--sub);margin-bottom:10px}
.net-line{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.net-line-label{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:4px}
.net-line-val{font-size:12px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.net-divider{border:none;border-top:1px solid var(--border);margin:8px 0}
.net-ratio{height:4px;background:#F1F5F9;border-radius:4px;overflow:hidden;margin:8px 0 6px}
.net-ratio-fill{height:100%;border-radius:4px;transition:width .4s ease,background-color .25s ease}
.net-ratio-fill.low{background:var(--income)}
.net-ratio-fill.mid{background:var(--invest)}
.net-ratio-fill.high{background:var(--expense)}
.net-total-label{font-size:11px;font-weight:700;color:var(--sub)}
.net-total-val{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;letter-spacing:-.2px}
.net-total-val.pos{color:var(--income)}
.net-total-val.neg{color:var(--expense)}

/* ── Header sparkline ────────────────────────────────────── */
.sparkline-wrap{position:absolute;bottom:8px;left:20px;right:20px}
.sparkline-label{font-size:9px;color:rgba(255,255,255,0.38);letter-spacing:.5px;text-transform:uppercase;margin-bottom:2px;display:flex;justify-content:space-between}
.sparkline-label span{color:rgba(255,255,255,0.55)}
#header-sparkline{width:100%;height:22px;display:block}

/* ── Responsive ──────────────────────────────────────────── */
@media(max-width:480px){
  .charts{grid-template-columns:1fr}
  .header-net{font-size:28px}
}
@media(min-width:640px){
  .cards{grid-template-columns:repeat(4,1fr)}
  .card{padding:20px}
  .card-ntd{font-size:20px}
  .card-idr{font-size:14px}
}
</style>
</head>
<body>


<!-- HEADER -->
<div class="header">
  <div class="taipei-bg" aria-hidden="true">
    <svg viewBox="0 0 1200 240" preserveAspectRatio="xMidYEnd slice">
      <!-- Far mountains (Yangmingshan silhouette) -->

  </div>
  <div class="daily-chart-box"><canvas id="daily-expense-chart"></canvas></div>
  <div class="header-veil"></div>

    <div class="header-top">
      <div class="header-logo">Financial Dashboard</div>
      <div class="header-top-right">
        <div class="sync-badge">
          🇹🇼 <span id="tw-clock">--:--:--</span>
        </div>
        <div class="rate-badge" id="rate-badge" title="Live kurs TWD → IDR">

<!-- MONTH TABS -->

<!-- CONTENT -->

<script>
const MONTHS = ["January","February","March","April","May","June",
                "July","August","September","October","November","December"];
const MONTH_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const TYPE_CLASS = {Income:"income",Expanse:"expense",Invest:"invest",Savings:"savings"};
const TYPE_COLORS = {
  income:  "#16A34A",
  expense: "#DC2626",
  invest:  "#D97706",
  savings: "#2563EB",
};
const TYPE_ICONS = {income:"💰",expense:"💸",invest:"📈",savings:"🏦"};
const TYPE_LABELS = {income:"Income",expense:"Expense",invest:"Invest",savings:"Savings"};

let allData = null;
let selectedMonth = MONTHS[new Date().getMonth()];
let filterType = "all";
let idrChart = null, ntdChart = null, sparklineChart = null;
let refreshTimer = null;

// Live exchange rate (TWD → IDR). 480 = fallback offline / before first fetch.
let LIVE_IDR_RATE = 480;
const RATE_CACHE_KEY  = "twd_idr_rate_v1";
const RATE_TTL_MS     = 60 * 60 * 1000;  // 1 jam
const RATE_REFRESH_MS = 60 * 60 * 1000;  // refresh tiap 1 jam

// ── Format helpers ─────────────────────────────────────────
function fmtIDR(n) {
  if (!n || n === 0) return "Rp 0";
  return "Rp " + Math.round(n).toLocaleString("id-ID");
}
function fmtNTD(n) {
  if (!n || n === 0) return "NT$ 0";
  return "NT$ " + Math.round(n).toLocaleString("en-US");
}
function shortIDR(n) {
  if (n >= 1e9) return "Rp " + (n/1e9).toFixed(1) + "B";
  if (n >= 1e6) return "Rp " + (n/1e6).toFixed(1) + "M";
  if (n >= 1e3) return "Rp " + (n/1e3).toFixed(0) + "K";
  return "Rp " + Math.round(n);
}
function shortNTD(n) {
  if (n >= 1e6) return "NT$ " + (n/1e6).toFixed(1) + "M";
  if (n >= 1e3) return "NT$ " + (n/1e3).toFixed(1) + "K";
  return "NT$ " + Math.round(n);
}

// ── Environment detection ──────────────────────────────────
// GitHub Pages (static) vs local Flask server
const IS_STATIC = !["localhost","127.0.0.1"].includes(location.hostname)
               && !location.hostname.match(/^(192\.|10\.|172\.)/);
const REFRESH_MS = IS_STATIC ? 30 * 1000 : 5 * 1000; // 30s online, 5s local (bot sudah sync langsung)

// ── Fetch data ─────────────────────────────────────────────
async function fetchData() {
  const url = IS_STATIC
    ? "data.json?_=" + Date.now()   // cache-bust GitHub Pages CDN
    : "/api/data";
  try {
    const res = await fetch(url);
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "Unknown error");
    return json.data;
  } catch(e) {
    return {error: e.message};
  }
}

// ── Build month tabs ───────────────────────────────────────
function buildTabs(data) {
  const wrap = document.getElementById("tabs");
  wrap.innerHTML = "";
  MONTHS.forEach((m, i) => {
    const hasData = data.months[m] && data.months[m].tx_count > 0;
    const el = document.createElement("div");
    el.className = "tab" + (m === selectedMonth ? " active" : "");
    el.textContent = MONTH_SHORT[i];
    el.dataset.month = m;
    el.onclick = () => selectMonth(m, data);
    wrap.appendChild(el);
    if (m === selectedMonth) {
      setTimeout(() => el.scrollIntoView({block:"nearest",inline:"center"}), 50);
    }
  });
}

function selectMonth(month, data) {
  selectedMonth = month;
  filterType = "all";
  document.querySelectorAll(".tab").forEach(t => {
    t.classList.toggle("active", t.dataset.month === month);
    if (t.dataset.month === month) {
      t.scrollIntoView({block:"nearest",inline:"center",behavior:"smooth"});
    }
  });
  renderContent(data);
}

// ── Render header ──────────────────────────────────────────
function renderHeader(data) {
  const m = data.months[selectedMonth];
  document.getElementById("header-month").textContent = selectedMonth + " 2026";

  if (m) {
    const portNTD = (m.ntd.income || 0) - (m.ntd.expense || 0) + (m.ntd.invest || 0) + (m.ntd.savings || 0);
    const portIDR = (m.idr.income || 0) - (m.idr.expense || 0) + (m.idr.invest || 0) + (m.idr.savings || 0);
    document.getElementById("header-port-ntd").textContent = fmtNTD(portNTD);
    document.getElementById("header-port-idr").textContent = fmtIDR(portIDR);
  } else {
    document.getElementById("header-port-ntd").textContent = "NT$ 0";
    document.getElementById("header-port-idr").textContent = "Rp 0";
  }
}

// ── Daily expense chart (header background) ───────────────
function drawDailyChart(txs, month) {
  const canvas = document.getElementById("daily-expense-chart");
  if (!canvas) return;
  if (sparklineChart) { sparklineChart.destroy(); sparklineChart = null; }

  const monthIdx    = MONTHS.indexOf(month);
  const daysInMonth = new Date(2026, monthIdx + 1, 0).getDate();
  const isThisMonth = monthIdx === new Date().getMonth();
  const today       = new Date().getDate();
  const IDR_RATE    = LIVE_IDR_RATE;  // pakai kurs live (fallback 480)

  const dailyNTD = Array(daysInMonth).fill(0);
  const dailyIDR = Array(daysInMonth).fill(0);
  txs.filter(t => t.type === "Expanse").forEach(t => {
    const day = parseInt(t.date.split("/")[0], 10) - 1;
    if (day >= 0 && day < daysInMonth) {
      dailyNTD[day] += (t.ntd || 0);
      dailyIDR[day] += (t.idr || 0) / IDR_RATE;
    }
  });

  // SELALU tampilkan SEMUA hari 1..daysInMonth di canvas (tidak dipotong).
  // Bar di hari tanpa transaksi tetap punya slot tapi tinggi 0 / transparent.
  const labels = Array.from({length: daysInMonth}, (_, i) => i + 1);
  const maxVal = Math.max(...dailyNTD, ...dailyIDR, 1);
  const cCtx   = canvas.getContext("2d");
  const ch     = canvas.offsetHeight || 200;

  // NTD = biru
  const gradNTD = cCtx.createLinearGradient(0, 0, 0, ch);
  gradNTD.addColorStop(0, "rgba(96,165,250,0.95)");   // blue-400 atas
  gradNTD.addColorStop(1, "rgba(37,99,235,0.40)");    // blue-600 bawah

  // IDR (Rp) = kuning
  const gradIDR = cCtx.createLinearGradient(0, 0, 0, ch);
  gradIDR.addColorStop(0, "rgba(253,224,71,0.95)");   // yellow-300 atas
  gradIDR.addColorStop(1, "rgba(202,138,4,0.40)");    // yellow-600 bawah

  // Warna seragam untuk semua hari (tidak ada highlight today/max-value)
  const colorsNTD = dailyNTD.map(v => v > 0 ? gradNTD : "rgba(0,0,0,0)");
  const colorsIDR = dailyIDR.map(v => v > 0 ? gradIDR : "rgba(0,0,0,0)");

  sparklineChart = new Chart(canvas, {
    type: "bar",
    data: {
      labels,
      datasets: [
        // NTD = bar di KIRI sub-slot (default grouped mode)
        { label:"NTD", data:dailyNTD, backgroundColor:colorsNTD,
          borderRadius:{topLeft:3,topRight:3}, borderSkipped:"bottom",
          barPercentage:0.88, categoryPercentage:0.88, order:1 },
        // IDR = bar di KANAN sub-slot
        { label:"IDR", data:dailyIDR, backgroundColor:colorsIDR,
          borderRadius:{topLeft:3,topRight:3}, borderSkipped:"bottom",
          barPercentage:0.88, categoryPercentage:0.88, order:2 }
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      layout:{padding:{bottom:2,top:4,left:0,right:0}},
      // Interaction: tampilkan tooltip di kolom hari manapun, tidak perlu
      // pointer tepat di atas bar (bar hari kosong transparan, mustahil di-hover).
      interaction:{mode:"index",intersect:false,axis:"x"},
      plugins: {
        legend:{display:false},
        tooltip: {
          enabled:true,
          mode:"index", intersect:false, axis:"x",
          position:"nearest",
          displayColors:true,
          // NTD selalu di atas, Rp di bawah — independen dari draw order
          // (draw order: IDR di depan supaya bar oranye overlay di atas NTD).
          itemSort: (a, b) => {
            if (a.dataset.label === "NTD" && b.dataset.label === "IDR") return -1;
            if (a.dataset.label === "IDR" && b.dataset.label === "NTD") return 1;
            return 0;
          },
          backgroundColor:"rgba(8,15,46,0.97)",
          titleColor:"#FACC15",
          bodyColor:"#fff",
          borderColor:"rgba(147,197,253,0.25)",
          borderWidth:1,
          padding:{x:12,y:10},
          cornerRadius:10,
          titleFont:{size:13,weight:"700"},
          bodyFont:{size:12,weight:"500"},
          bodySpacing:4,
          boxPadding:6,
          caretSize:6,
          callbacks: {
            title: ctx => {
              if (!ctx.length) return "";
              const day = String(ctx[0].label).padStart(2,"0");
              const mi  = String(monthIdx+1).padStart(2,"0");
              return `${day}/${mi}/2026`;
            },
            // Selalu tampilkan NTD dan IDR aktual (bukan konversi).
            // Empty day → "Tidak ada pengeluaran" via beforeBody.
            beforeBody: ctx => {
              const ntd = ctx.find(c => c.dataset.label === "NTD")?.raw || 0;
              const idr = (ctx.find(c => c.dataset.label === "IDR")?.raw || 0) * IDR_RATE;
              if (ntd <= 0 && idr <= 0) return "Tidak ada pengeluaran";
              return "";
            },
            label: ctx => {
              if (ctx.dataset.label === "NTD") return "  " + fmtNTD(ctx.raw);
              // IDR dataset: ctx.raw disimpan dalam unit NTD-equivalent → kalikan balik
              return "  " + fmtIDR(ctx.raw * IDR_RATE);
            },
            labelColor: ctx => {
              // NTD biru, IDR kuning — match dengan gradient bar
              const c = ctx.dataset.label === "NTD"
                ? "rgba(96,165,250,0.95)" : "rgba(253,224,71,0.95)";
              return {backgroundColor:c,borderColor:c,borderWidth:0,borderRadius:3};
            },
            // Tampilkan KEDUA mata uang selama hari itu tidak benar-benar kosong
            // (kalau kosong, label di-suppress; beforeBody yang menampilkan pesan).
            filter: (item, _i, _arr, data) => {
              const idx  = item.dataIndex;
              const ntd  = data.datasets[0].data[idx] || 0;
              const idrE = data.datasets[1].data[idx] || 0;
              return (ntd > 0 || idrE > 0);
            },
          }
        }
      },
      scales: {
        x: {
          display:true,
          ticks:{
            color:"rgba(255,255,255,0.55)",
            font:{size:9,weight:"500"},
            maxRotation:0,autoSkip:false,padding:4
          },
          grid:{display:false},
          border:{display:false},
        },
        y:{display:false, beginAtZero:true, max:maxVal*1.15}
      },
      animation:{duration:500,easing:"easeOutQuart"}
    }
  });
}

// ── Render cards ───────────────────────────────────────────
function cardsHTML(m) {
  if (!m) return "";
  const types = ["income","expense","invest","savings"];
  return types.map(t => {
    const idr = m.idr[t] || 0;
    const ntd = m.ntd[t] || 0;
    return `
    <div class="card ${t}">
      <div class="card-icon">${TYPE_ICONS[t]}</div>
      <div class="card-label">${TYPE_LABELS[t]}</div>
      <div class="card-ntd${ntd===0?' card-zero':''}">${fmtNTD(ntd)}</div>
      <div class="card-idr${idr===0?' card-zero':''}">${fmtIDR(idr)}</div>
    </div>`;
  }).join("");
}

// ── Net row ────────────────────────────────────────────────
function netRowHTML(m) {
  if (!m) return "";
  const netIDR = m.idr.income - m.idr.expense;
  const netNTD = m.ntd.income - m.ntd.expense;
  const posI = netIDR >= 0, posN = netNTD >= 0;
  function card(title, inc, exp, net, pos, fmtInc, fmtExp, fmtNet) {
    // Spending ratio: berapa % income yang sudah keluar
    const spentPct = inc > 0 ? Math.min(100, Math.round((exp / inc) * 100)) : (exp > 0 ? 100 : 0);
    const ratioLevel = spentPct < 50 ? 'low' : spentPct < 80 ? 'mid' : 'high';
    const ratioHTML = (inc > 0 || exp > 0) ? `
      <div class="net-ratio" title="${spentPct}% income terpakai">
        <div class="net-ratio-fill ${ratioLevel}" style="width:${spentPct}%"></div>
      </div>` : '';
    return `
    <div class="net-card">
      <div class="net-card-title">${title}</div>
      <div class="net-line">
        <span class="net-line-label"><span style="color:var(--income)">↑</span> Income</span>
        <span class="net-line-val" style="color:var(--income)">${fmtInc(inc)}</span>
      </div>
      <div class="net-line">
        <span class="net-line-label"><span style="color:var(--expense)">↓</span> Expense</span>
        <span class="net-line-val" style="color:var(--expense)">${fmtExp(exp)}</span>
      </div>
      ${ratioHTML}
      <hr class="net-divider">
      <div class="net-line">
        <span class="net-total-label">Net</span>
        <span class="net-total-val ${pos?'pos':'neg'}">${pos?'+':'-'}${fmtNet(Math.abs(net))}</span>
      </div>
    </div>`;
  }
  return `
  <div class="net-row">
    ${card('IDR Balance', m.idr.income, m.idr.expense, netIDR, posI, fmtIDR, fmtIDR, fmtIDR)}
    ${card('NTD Balance', m.ntd.income, m.ntd.expense, netNTD, posN, fmtNTD, fmtNTD, fmtNTD)}
  </div>`;
}

// ── Render charts ──────────────────────────────────────────
function buildChart(canvasId, data, totFn, label) {
  const ctx = document.getElementById(canvasId);
  if (!ctx) return null;
  const vals = [
    data.income  || 0,
    data.expense || 0,
    data.invest  || 0,
    data.savings || 0,
  ];
  const total = vals.reduce((a,b)=>a+b,0);
  const colors = [TYPE_COLORS.income, TYPE_COLORS.expense, TYPE_COLORS.invest, TYPE_COLORS.savings];
  const chart = new Chart(ctx, {
    type: "doughnut",
    data: {
      labels: ["Income","Expense","Invest","Savings"],
      datasets: [{
        data: total > 0 ? vals : [1,1,1,1],
        backgroundColor: total > 0 ? colors : ["#E2E8F0","#E2E8F0","#E2E8F0","#E2E8F0"],
        borderWidth: 0,
        hoverOffset: 6,
      }],
    },
    options: {
      cutout: "68%",
      animation: {duration: 600, easing: "easeInOutQuart"},
      plugins: {
        legend: {display: false},
        tooltip: {
          callbacks: {
            label(item) {
              const v = item.raw;
              const pct = total > 0 ? Math.round(v/total*100) : 0;
              return ` ${totFn(v)} (${pct}%)`;
            }
          }
        }
      }
    },
    plugins: [{
      id: "centerText",
      afterDraw(chart) {
        const {ctx: c, chartArea: {width, height, left, top}} = chart;
        const cx = left + width/2, cy = top + height/2;
        c.save();
        c.textAlign = "center"; c.textBaseline = "middle";
        c.font = "bold 13px -apple-system,sans-serif";
        c.fillStyle = total > 0 ? "#0F172A" : "#CBD5E1";
        c.fillText(total > 0 ? totFn(total) : "No data", cx, cy - 6);
        c.font = "10px -apple-system,sans-serif";
        c.fillStyle = "#64748B";
        c.fillText(label, cx, cy + 10);
        c.restore();
      }
    }]
  });
  return chart;
}

function chartsHTML(m) {
  const types = ["income","expense","invest","savings"];
  const legend = types.map((t,i)=>`
    <div class="legend-item">
      <div class="legend-dot" style="background:${TYPE_COLORS[t]}"></div>
      ${TYPE_LABELS[t]}
    </div>`).join("");
  return `
  <div class="chart-card">
    <div class="chart-title">IDR Distribution</div>
    <div class="chart-wrap"><canvas id="chart-idr" height="160"></canvas></div>
    <div class="chart-legend">${legend}</div>
  </div>
  <div class="chart-card">
    <div class="chart-title">NTD Distribution</div>
    <div class="chart-wrap"><canvas id="chart-ntd" height="160"></canvas></div>
    <div class="chart-legend">${legend}</div>
  </div>`;
}

// ── Render transactions ─────────────────────────────────────
function txListHTML(txs) {
  if (!txs || txs.length === 0) {
    return `<div class="empty-state"><span class="empty-icon">📭</span>Belum ada transaksi</div>`;
  }
  const filtered = filterType === "all" ? txs : txs.filter(t =>
    (filterType === "income"  && t.type === "Income")  ||
    (filterType === "expense" && t.type === "Expanse") ||
    (filterType === "invest"  && t.type === "Invest")  ||
    (filterType === "savings" && t.type === "Savings")
  );
  if (filtered.length === 0) {
    return `<div class="empty-state"><span class="empty-icon">🔍</span>Tidak ada transaksi ${TYPE_LABELS[filterType]}</div>`;
  }
  return filtered.map(tx => {
    const cls = TYPE_CLASS[tx.type] || "income";
    const desc = tx.description || tx.category || "—";
    const cat  = tx.category ? `${tx.category}` : "—";
    const showIDR = tx.idr > 0;
    const showNTD = tx.ntd > 0;
    // Single-currency tx → tampilkan satu nominal besar; both → primary IDR + sub NTD
    let amtHTML;
    if (showNTD && !showIDR) {
      amtHTML = `<div class="tx-amt-primary">${fmtNTD(tx.ntd)}</div>`;
    } else if (showIDR && !showNTD) {
      amtHTML = `<div class="tx-amt-primary">${fmtIDR(tx.idr)}</div>`;
    } else if (showIDR && showNTD) {
      amtHTML = `<div class="tx-idr">${fmtIDR(tx.idr)}</div><div class="tx-ntd">${fmtNTD(tx.ntd)}</div>`;
    } else {
      amtHTML = `<div class="tx-amt-primary" style="color:var(--sub);font-weight:500">Rp 0</div>`;
    }
    return `
    <div class="tx-item ${cls}">
      <div class="tx-dot ${cls}"></div>
      <div class="tx-info">
        <div class="tx-desc">${desc}</div>
        <div class="tx-meta">${tx.date} · ${cat}</div>
      </div>
      <div class="tx-amt">
        ${amtHTML}
      </div>
    </div>`;
  }).join("");
}

// ── Main render ────────────────────────────────────────────
function renderContent(data) {
  if (idrChart) { idrChart.destroy(); idrChart = null; }
  if (ntdChart) { ntdChart.destroy(); ntdChart = null; }

  renderHeader(data);

  const m = data.months[selectedMonth];
  const txs = m ? m.transactions : [];

  const html = `
    ${m ? '' : '<div class="error-banner">Tidak ada data untuk bulan ini.</div>'}
    <div class="cards">${cardsHTML(m)}</div>
    ${netRowHTML(m)}
    <div class="charts">${chartsHTML(m)}</div>
    <div class="section-header">
      <div class="section-title">Transactions</div>
      <div class="tx-count">${txs.length} transaksi</div>
    </div>
    <div class="filter-tabs" id="filter-tabs">${filterTabsHTML()}</div>
    <div class="tx-list" id="tx-list">${txListHTML(txs)}</div>
  `;
  document.getElementById("content").innerHTML = html;

  // Bind filter tabs
  document.querySelectorAll(".ftab").forEach(el => {
    el.onclick = () => {
      filterType = el.dataset.filter;
      document.querySelectorAll(".ftab").forEach(e => e.classList.toggle("active", e.dataset.filter === filterType));
      document.getElementById("tx-list").innerHTML = txListHTML(txs);
    };
  });

  // Build charts after DOM is ready
  setTimeout(() => {
    drawDailyChart(txs, selectedMonth);
    if (m) {
      idrChart = buildChart("chart-idr", m.idr, shortIDR, "IDR Total");
      ntdChart = buildChart("chart-ntd", m.ntd, shortNTD, "NTD Total");
    }
  }, 0);
}

// ── Live exchange rate (TWD → IDR) ─────────────────────────
function loadCachedRate() {
  try {
    const raw = localStorage.getItem(RATE_CACHE_KEY);
    if (!raw) return null;
    const {rate, ts} = JSON.parse(raw);
    if (!rate || (Date.now() - ts) > RATE_TTL_MS) return {rate, stale:true};
    return {rate, stale:false};
  } catch { return null; }
}
function saveCachedRate(rate) {
  try { localStorage.setItem(RATE_CACHE_KEY, JSON.stringify({rate, ts: Date.now()})); } catch {}
}
function renderRate(rate, stale) {
  const badge = document.getElementById("rate-badge");
  const span  = document.getElementById("rate-display");
  if (!badge || !span) return;
  span.textContent = "Rp " + Math.round(rate).toLocaleString("id-ID");
  badge.classList.toggle("stale", !!stale);
  badge.title = stale
    ? "Kurs cached (offline). Akan refresh saat online."
    : "Live kurs TWD → IDR (sumber: frankfurter.app)";
}
async function fetchExchangeRate() {
  // Primary: frankfurter.app (free, CORS-enabled). Fallback: open.er-api.com
  try {
    const r = await fetch("https://api.frankfurter.app/latest?from=TWD&to=IDR", {cache:"no-store"});
    if (r.ok) {
      const j = await r.json();
      if (j?.rates?.IDR > 0) return j.rates.IDR;
    }
  } catch {}
  try {
    const r = await fetch("https://open.er-api.com/v6/latest/TWD", {cache:"no-store"});
    if (r.ok) {
      const j = await r.json();
      if (j?.rates?.IDR > 0) return j.rates.IDR;
    }
  } catch {}
  return null;
}
async function refreshRate() {
  // Tampilkan cached dulu (kalau ada) supaya UI nggak kosong
  const cached = loadCachedRate();
  if (cached) {
    LIVE_IDR_RATE = cached.rate;
    renderRate(cached.rate, cached.stale);
  }
  const fresh = await fetchExchangeRate();
  if (fresh) {
    LIVE_IDR_RATE = fresh;
    saveCachedRate(fresh);
    renderRate(fresh, false);
    // Re-render chart kalau kurs berubah signifikan (>2%)
    if (allData && cached && Math.abs(fresh - cached.rate) / cached.rate > 0.02) {
      renderContent(allData);
    }
  } else if (!cached) {
    renderRate(LIVE_IDR_RATE, true);  // fallback 480
  }
}

// ── Auto-rollover: net worth bulan kemarin → income bulan ini ──
// Hanya berlaku untuk bulan yang sudah dimulai (≤ bulan saat ini).
// Future months tetap 0 sampai tanggal 1 bulan tersebut tiba.
function processRollover(data) {
  if (!data?.months) return;
  const todayMonth = new Date().getMonth();  // 0-based: 0=Jan, 11=Dec
  for (let i = 1; i < MONTHS.length; i++) {
    if (i > todayMonth) continue;  // bulan belum dimulai → skip rollover
    const prev = data.months[MONTHS[i - 1]];
    const cur  = data.months[MONTHS[i]];
    if (!prev || !cur) continue;

    const pn = prev.ntd || {}, pi = prev.idr || {};
    const prevNetNTD = (pn.income||0) - (pn.expense||0) + (pn.invest||0) + (pn.savings||0);
    const prevNetIDR = (pi.income||0) - (pi.expense||0) + (pi.invest||0) + (pi.savings||0);
    if (prevNetNTD <= 0 && prevNetIDR <= 0) continue;

    cur.ntd = cur.ntd || {income:0,expense:0,invest:0,savings:0};
    cur.idr = cur.idr || {income:0,expense:0,invest:0,savings:0};
    cur.transactions = cur.transactions || [];
    // Skip kalau sudah pernah ditambahkan (defensive — fetched data harusnya fresh)
    if (cur.transactions.some(t => t.category === "Sisa Bulan Lalu")) continue;

    const rolloverNTD = Math.max(0, prevNetNTD);
    const rolloverIDR = Math.max(0, prevNetIDR);
    cur.ntd.income = (cur.ntd.income||0) + rolloverNTD;
    cur.idr.income = (cur.idr.income||0) + rolloverIDR;

    const mNum = String(i + 1).padStart(2, "0");
    cur.transactions.push({
      date:        `01/${mNum}/2026`,
      type:        "Income",
      category:    "Sisa Bulan Lalu",
      description: `Sisa bulan ${MONTHS[i-1]} (auto-rollover)`,
      ntd:         rolloverNTD,
      idr:         rolloverIDR,
    });
    cur.tx_count = (cur.tx_count||0) + 1;
  }
}

// ── Init & auto-refresh ────────────────────────────────────
async function init() {
  document.getElementById("content").innerHTML = '<div class="loading"><div class="spinner"></div></div>';

  const data = await fetchData();
  if (data.error) {
    document.getElementById("content").innerHTML = `
      <div class="error-banner">⚠️ Gagal memuat data: ${data.error}</div>
      <div class="loading"><p style="color:var(--sub);font-size:13px">Retry dalam 15 detik…</p></div>`;
    return;
  }

  processRollover(data);
  allData = data;
  buildTabs(data);
  renderContent(data);
}

async function refresh() {
  const data = await fetchData();
  if (!data.error) {
    processRollover(data);
    allData = data;
    buildTabs(data);
    renderContent(data);
  }
}

// ── Taiwan live clock (Asia/Taipei = UTC+8) ────────────────
const TW_DATE = new Intl.DateTimeFormat("id-ID", {timeZone:"Asia/Taipei",day:"2-digit",month:"2-digit",year:"numeric"});
const TW_TIME = new Intl.DateTimeFormat("id-ID", {timeZone:"Asia/Taipei",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
function updateClock() {
  const now = new Date();
  document.getElementById("tw-clock").textContent = TW_DATE.format(now) + "  " + TW_TIME.format(now);
}

function startDashboard() {
  updateClock();
  setInterval(updateClock, 1000);
  refreshRate();                                  // fetch kurs sekarang
  setInterval(refreshRate, RATE_REFRESH_MS);      // refresh kurs tiap 1 jam
  init();
  setInterval(refresh, REFRESH_MS);
}

startDashboard();
</script>
